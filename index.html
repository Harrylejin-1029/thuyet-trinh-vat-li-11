<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chuyên đề II: Truyền thông tin bằng sóng vô tuyến — Bài 4 & Bài 5 (Vật lí 11)</title>
    
    <!-- KaTeX Mathematical Typography (Local + CDN Fallback) -->
    <link rel="stylesheet" href="libs/katex/katex.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css" />
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
    <div class="stage-wrapper">
        <!-- Top Navigation Bar / Lesson Switcher Portal -->
        <div class="top-nav-bar">
            <div class="portal-badge">📡 CHUYÊN ĐỀ II • TRUYỀN THÔNG TIN BẰNG SÓNG VÔ TUYẾN</div>
            <div class="lesson-switcher">
                <button class="lesson-tab active" id="tab-bai4" onclick="switchLesson('bai4')" title="Bài 4: Biến điệu (AM & FM)">
                    📻 BÀI 4: BIẾN ĐIỆU (AM & FM)
                </button>
                <button class="lesson-tab tab-blue" id="tab-bai5" onclick="switchLesson('bai5')" title="Bài 5: Tín hiệu tương tự và Tín hiệu số">
                    🔢 BÀI 5: TÍN HIỆU TƯƠNG TỰ & SỐ
                </button>
            </div>
            <a href="Bai4_BienDieu_VatLi11.pptx" id="link-pptx-download" download class="btn-download-pptx" title="Tải file PowerPoint (.pptx) chiếu offline">
                📥 Tải PPTX Bài 4
            </a>
        </div>

        <!-- Main 16:9 Presentation Stage -->
        <div class="deck-container" id="deck">
            <div class="progress-track">
                <div class="progress-fill" id="progress-fill" style="width: 4.54%;"></div>
            </div>
            <!-- Slides dynamically injected by js/app.js -->
        </div>

        <!-- Bottom Presenter Control Bar -->
        <div class="presenter-bar">
            <!-- Navigation -->
            <div class="nav-group">
                <button class="btn" id="btn-prev" onclick="prevSlide()" title="Slide trước (←)">◀ Trước</button>
                <span class="counter-pill" id="slide-counter">1 / 24</span>
                <button class="btn" id="btn-next" onclick="nextSlide()" title="Slide tiếp theo (→ / Space)">Tiếp ▶</button>
            </div>

            <!-- Content Zoom Controls -->
            <div class="nav-group zoom-group" title="Thu phóng kích thước chữ và nội dung slide (Phím +, -)">
                <button class="btn-zoom" id="btn-zoom-out" onclick="zoomOut()" title="Thu nhỏ chữ (-)">🔍−</button>
                <span class="counter-pill zoom-pill" id="zoom-val" onclick="resetZoom()" title="Đặt lại 100% (Phím 0)">100%</span>
                <button class="btn-zoom" id="btn-zoom-in" onclick="zoomIn()" title="Phóng to chữ (+)">🔍+</button>
            </div>

            <!-- Recording Suite (Video Screen + Mic Voice) -->
            <div class="nav-group">
                <button class="btn btn-record" id="btn-record-video" onclick="startVideoRecording()" title="Quay video màn hình + thu giọng nói qua Micro">📹 Quay video</button>
                <button class="btn btn-record" id="btn-record-audio" onclick="startAudioRecording()" title="Ghi âm giọng nói thuyết trình qua Micro">🎙️ Ghi âm</button>
            </div>

            <!-- Presentation Tools -->
            <div class="nav-group">
                <button class="btn" id="btn-overview" onclick="toggleOverview()" title="Xem toàn bộ mục lục slide (G)">⊞ Mục lục (G)</button>
                <button class="btn" id="btn-notes" onclick="toggleNotes()" title="Bật/Tắt lời thuyết trình (S)">📝 Lời nói (S)</button>
                <button class="btn" id="btn-laser" onclick="toggleLaser()" title="Con trỏ Laser (L)">🔴 Laser (L)</button>
                <button class="btn" id="btn-fullscreen" onclick="toggleFullscreen()" title="Toàn màn hình (F)">⛶ Toàn màn hình (F)</button>
            </div>
        </div>

        <!-- Speaker Notes Drawer -->
        <div class="notes-drawer" id="notes-drawer" style="display: none;">
            <div class="notes-header">
                <span>🎙️ LỜI THUYẾT TRÌNH CHI TIẾT (SPEAKER NOTES)</span>
                <span id="notes-slide-label">Slide 1 / 22</span>
            </div>
            <div id="notes-content" style="white-space: pre-line;"></div>
        </div>
    </div>

    <!-- Floating Recording HUD -->
    <div class="recording-hud" id="recording-hud" style="display: none;">
        <span class="rec-pulse-dot"></span>
        <span class="rec-status-label" id="rec-status-label">ĐANG QUAY VIDEO</span>
        <span class="rec-timer-pill" id="rec-timer-display">00:00</span>
        <button class="rec-hud-btn" id="btn-rec-pause" onclick="togglePauseRecording()">⏸ Tạm dừng</button>
        <button class="rec-hud-btn rec-hud-stop" onclick="stopRecording()">⏹ Dừng & Lưu</button>
    </div>

    <!-- Recording Review / Download Modal -->
    <div class="record-modal" id="record-modal">
        <div class="record-modal-card">
            <div class="record-modal-header">
                <div class="record-modal-title" id="record-modal-title">🎬 BẢN QUAY ĐÃ HOÀN TẤT!</div>
                <button class="btn" onclick="closeReviewModal()">✕ Đóng</button>
            </div>
            <div class="record-preview-container" id="record-preview-container"></div>
            <div class="record-meta-info" id="record-meta-info"></div>
            <div class="record-modal-actions">
                <button class="btn" onclick="downloadRecordingAgain()">💾 Tải lại tệp</button>
                <button class="btn" onclick="closeReviewModal()">✕ Hoàn tất & Đóng</button>
            </div>
        </div>
    </div>

    <!-- Toast Notifications Container -->
    <div class="toast-container" id="toast-container"></div>

    <!-- Multi-Slide Overview Modal -->
    <div class="overview-modal" id="overview-modal">
        <div class="overview-header">
            <h2 id="overview-modal-title" style="color: var(--amber); font-size: 1.25rem;">MỤC LỤC 24 SLIDE — BÀI 4: BIẾN ĐIỆU (AM & FM)</h2>
            <button class="btn" onclick="toggleOverview()">✕ Đóng (Esc)</button>
        </div>
        <div class="overview-grid" id="overview-grid"></div>
    </div>

    <!-- Laser Pointer Dot -->
    <div class="laser-dot" id="laser-dot"></div>

    <!-- KaTeX Mathematical Rendering Engine (Offline + CDN Fallback) -->
    <script src="libs/katex/katex.min.js"></script>
    <script>window.katex || document.write('<script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"><\\/script>')</script>
    <script src="libs/katex/auto-render.min.js"></script>
    <script>window.renderMathInElement || document.write('<script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"><\\/script>')</script>

    <!-- Three.js Libraries (Offline + Fast CDN Fallback) -->
    <script src="libs/three.min.js"></script>
    <script>window.THREE || document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"><\\/script>')</script>
    <script src="libs/OrbitControls.js"></script>
    <script>window.THREE && window.THREE.OrbitControls || document.write('<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"><\\/script>')</script>

    <!-- Bài 5 Simulations & Data -->
    <script src="js/sims-3d.js"></script>
    <script src="js/sims-2d.js"></script>
    <script src="js/slides-data.js"></script>

    <!-- Bài 4 Simulations & Data -->
    <script src="js/sims-bai4-3d.js"></script>
    <script src="js/sims-bai4-2d.js"></script>
    <script src="js/slides-bai4.js"></script>

    <!-- Core Presenter & Recording Engines -->
    <script src="js/recorder.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
